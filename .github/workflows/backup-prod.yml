name: Back up prod

# Prod has NO automated backups (BSR-532).
#
# The Supabase org is on the `free` plan, and daily backups + point-in-time
# recovery are paid features. So today a dropped project, a bad migration, or an
# accidental bulk delete is unrecoverable — on a database holding a real
# workspace, about to receive real customer contacts in M2.
#
# This is a COMPENSATING CONTROL, not a substitute for Pro-tier backups. It gives
# a ~24h RPO and an off-database copy. It does not give point-in-time recovery,
# and it cannot recover the fifteen minutes before a mistake. Upgrading the plan
# is still the right answer; this exists so that "unrecoverable" stops being true
# while that decision is made.
#
# ── Why the dump is encrypted ─────────────────────────────────────────────────
# THIS REPOSITORY IS PUBLIC. Artifacts on a public repo are downloadable by
# anyone who can see the workflow run. A plaintext dump here would publish every
# contact, email address and campaign in the CRM.
#
# So the dump is encrypted with `age` to a PUBLIC key held in the repo variable
# BACKUP_AGE_RECIPIENT. Asymmetric on purpose: CI can encrypt and cannot decrypt,
# so nothing in this workflow — or in the artifact it produces — can be used to
# read the backup. Only the holder of the matching private key can.
#
# Setup, once (see docs/runbooks/backup-and-restore.md):
#   age-keygen -o arc-backup.key      # keep this file OFF this repo
#   gh variable set BACKUP_AGE_RECIPIENT --body "age1..."   # the public half
#
# Until that variable exists this workflow FAILS rather than silently producing
# nothing, or worse, producing a plaintext dump.

on:
  schedule:
    # 07:10 UTC daily — after the nightly smoke, before the working day here.
    - cron: "10 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Workload Identity Federation: GitHub mints a short-lived OIDC token that
  # Google exchanges for a scoped credential. No service-account key exists to
  # leak, rotate, or forget about.
  id-token: write

concurrency:
  group: backup-prod
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Fail loudly if the database URL is missing
        env:
          DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "::error title=PROD_SUPABASE_DB_URL is not set::Prod cannot be backed up. Store the prod Postgres connection string as the PROD_SUPABASE_DB_URL secret (the same one migrate-prod.yml uses)."
            exit 1
          fi

      - name: Fail loudly if there is nobody to encrypt to
        env:
          RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          if [ -z "${RECIPIENT:-}" ]; then
            echo "::error title=BACKUP_AGE_RECIPIENT is not set::This repository is PUBLIC, so an unencrypted dump would publish the whole CRM. Generate a key with 'age-keygen -o arc-backup.key', keep the private file off this repo, and set the public half: gh variable set BACKUP_AGE_RECIPIENT --body 'age1...'. See docs/runbooks/backup-and-restore.md."
            exit 1
          fi
          # A wrong-shaped value here would produce an artifact nobody can read,
          # which is worse than failing: it looks like a working backup.
          case "$RECIPIENT" in
            age1*) : ;;
            *) echo "::error title=BACKUP_AGE_RECIPIENT looks wrong::Expected an age public key starting 'age1'. A malformed recipient produces an unreadable artifact that still looks like a successful backup."; exit 1 ;;
          esac

      - name: Install age
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      # Postgres 17 client, matched to the server.
      #
      # The first version of this used `supabase db dump`, on the reasoning that
      # the CLI ships its own client so there could be no version mismatch. That
      # was wrong: the CLI runs pg_dump inside a container pinned to Postgres 15,
      # and prod is 17.6, so it aborted with
      #   `pg_dumpall: aborting because of server version mismatch`.
      # pg_dump refuses to dump a NEWER server than itself, by design — a dump
      # taken by an older client could silently miss newer syntax.
      - name: Install the Postgres 17 client
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      # Four parts, because a restore needs all four and a schema-only dump is
      # the classic "backup" that turns out to hold no data.
      #
      # `public` is this application. `app_private` holds the four SECURITY
      # DEFINER functions every tenant-isolation policy calls, `auth.users` and
      # `auth.identities` let people sign in to a restored copy, and the prereq
      # file carries extensions that a `--schema=public` dump silently omits.
      # Supabase-managed internals are left out deliberately: a fresh project
      # recreates them, and restoring ours over them fails confusingly.
      #
      # Every one of those beyond `public` was added on 2026-07-31 after the
      # first real restore test (BSR-532). Dumping `public` alone produced a
      # backup that restored to 19 of 157 policies, 0 campaigns, 0 accounts and
      # no Brain — green in CI, useless in an incident. See
      # docs/runbooks/backup-and-restore.md for the measured before/after.
      - name: Dump schema, data and accounts
        env:
          DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
          PGCLIENTENCODING: UTF8
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "30"
        run: |
          set -euo pipefail
          mkdir -p backup
          PG=/usr/lib/postgresql/17/bin

          # Do NOT hand the connection URI to pg_dump.
          #
          # The stored password contains an `@`, and libpq split the URI at the
          # wrong one — it tried to resolve a host of `592800@aws-1-...` and
          # failed. Percent-encoding the secret would also fix it, but that puts
          # a parsing trap in a value a human maintains by hand.
          #
          # Splitting on the LAST `@` is unambiguous whatever the password
          # contains, so the components go in as discrete parameters and the
          # password via ~/.pgpass. Nothing is echoed: the URL is a secret, and
          # while GitHub masks known secrets in logs, the safe move is to never
          # print the pieces at all.
          python3 - <<'PARSE'
          import os, re, pathlib
          url = os.environ["DB_URL"]
          rest = re.sub(r"^[a-zA-Z0-9+]+://", "", url).split("?", 1)[0]
          userinfo, hostpart = rest.rsplit("@", 1)          # last @ = the real separator
          user, _, password = userinfo.partition(":")
          hostport, _, database = hostpart.partition("/")
          host, _, port = hostport.partition(":")
          port = port or "5432"
          database = database or "postgres"
          pgpass = pathlib.Path.home() / ".pgpass"
          pgpass.write_text(f"{host}:{port}:{database}:{user}:{password}\n")
          pgpass.chmod(0o600)
          # An env file sourced below, NOT $GITHUB_ENV — that only applies to
          # later steps, and pg_dump runs in this one.
          with open("/tmp/pgenv.sh", "w") as fh:
              fh.write(f"export PGHOST={host}\nexport PGPORT={port}\n")
              fh.write(f"export PGUSER={user}\nexport PGDATABASE={database}\n")
          PARSE

          . /tmp/pgenv.sh

          # Retry the connection. A run on 2026-07-31 failed with
          #   `connection to ... port 5432 failed: Connection timed out`
          # on a step that had worked forty minutes earlier — a pooler blip, not
          # a configuration fault. Without this, one transient timeout costs a
          # whole night's backup, and the next chance is 24 hours later.
          #
          # Still fails loudly after three tries: a backup that quietly gives up
          # is the failure mode this whole workflow exists to avoid.
          dump_with_retry() {
            local desc="$1"; shift
            local attempt=1
            until "$PG/pg_dump" "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error title=Dump failed::$desc failed after 3 attempts."
                return 1
              fi
              echo "::warning title=Retrying::$desc failed on attempt ${attempt}; retrying in $((attempt * 20))s."
              sleep $((attempt * 20))
              attempt=$((attempt + 1))
            done
          }

          # Extensions a --schema=public dump does NOT emit. `vector` lives in
          # public here, so without this the Brain's knowledge_nodes table (and
          # everything referencing it) fails to create and 490 rows of Arc's
          # memory are lost. Only public-schema extensions are emitted: the ones
          # in `extensions`/`vault` are Supabase-managed and already present.
          "$PG/psql" -qAt -o backup/00-prereq.sql <<'SQL'
          select 'CREATE EXTENSION IF NOT EXISTS ' || quote_ident(extname)
                 || ' WITH SCHEMA ' || quote_ident(n.nspname) || ';'
          from pg_extension e join pg_namespace n on n.oid = e.extnamespace
          where n.nspname = 'public' and extname <> 'plpgsql'
          order by extname;
          SQL

          # app_private alongside public, in ONE dump so pg_dump orders the
          # isolation functions before the policies that call them. Dumped
          # separately they would land after, and 138 of 157 CREATE POLICY
          # statements would fail.
          dump_with_retry "schema" --schema=public --schema=app_private --schema-only --no-owner --no-privileges -f backup/schema.sql
          dump_with_retry "data"   --schema=public --data-only   --no-owner --no-privileges -f backup/data.sql
          # Accounts. `identities` as well as `users`: GoTrue matches a login to
          # a provider identity, so users-only restores to a database where
          # every account exists and nobody can sign in.
          #
          # Failing here must not fail the backup — the CRM data is the point —
          # but it must be visible rather than quietly absent.
          if ! "$PG/pg_dump" --table=auth.users --table=auth.identities --data-only --no-owner --no-privileges -f backup/auth-users.sql; then
            echo "::warning title=Accounts not dumped::auth.users/identities could not be read; the restore will hold data but no logins. Everything else in this backup is intact."
            echo "-- auth accounts dump failed at $(date -u +%FT%TZ); see the run log" > backup/auth-users.sql
          fi

          cp .github/workflows/restore.sh backup/restore.sh
          chmod +x backup/restore.sh
          ls -l backup/

      # Storage bytes. The Postgres dump carries `storage.objects` METADATA —
      # rows describing files — but not the files. Restoring without this gives
      # you a database full of rows pointing at objects that do not exist, which
      # looks like a working restore until someone opens a campaign.
      #
      # No credential is needed while every bucket is public: the objects are
      # already served unauthenticated. A PRIVATE bucket cannot be read this way
      # and is reported as a gap rather than skipped quietly — see the manifest
      # check below.
      - name: Back up storage objects
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          # A ceiling so a growing bucket cannot quietly turn a 6 MB nightly
          # backup into a gigabyte one. Raise it deliberately.
          MAX_TOTAL_BYTES: "524288000"   # 500 MB
        run: |
          set -euo pipefail
          PG=/usr/lib/postgresql/17/bin
          . /tmp/pgenv.sh

          if [ -z "${PROJECT_REF:-}" ]; then
            echo "::error title=SUPABASE_PROJECT_REF is not set::Storage bytes cannot be fetched without the project ref. Set it with: gh variable set SUPABASE_PROJECT_REF --body '<ref>'. It is not a secret — it already ships in the client bundle."
            exit 1
          fi

          # JSON, not TSV: object names are arbitrary paths and a tab or newline
          # in one would silently corrupt a line-based manifest.
          "$PG/psql" -qAt -o backup/storage-inventory.json <<'SQL'
          select coalesce(json_agg(json_build_object(
                   'bucket', o.bucket_id, 'name', o.name,
                   'size', (o.metadata->>'size')::bigint,
                   'mime', coalesce(o.metadata->>'mimetype', 'application/octet-stream'),
                   'public', b.public
                 ) order by o.bucket_id, o.name), '[]'::json)
          from storage.objects o join storage.buckets b on b.id = o.bucket_id;
          SQL

          python3 - <<'FETCH'
          import hashlib, json, os, pathlib, sys, urllib.parse, urllib.request

          ref = os.environ["PROJECT_REF"]
          cap = int(os.environ["MAX_TOTAL_BYTES"])
          items = json.load(open("backup/storage-inventory.json"))
          root = pathlib.Path("backup/storage")

          declared = sum(int(i["size"] or 0) for i in items)
          if declared > cap:
              print(f"::error title=Storage too large::{declared} bytes exceeds the {cap} cap. "
                    "Raise MAX_TOTAL_BYTES deliberately, or move storage to its own backup.")
              sys.exit(1)

          private = sorted({i["bucket"] for i in items if not i["public"]})
          if private:
              # Loud, because a silent skip here is exactly the failure the
              # 2026-07-31 restore test found: a green backup missing something.
              print("::warning title=Private buckets not backed up::"
                    f"{', '.join(private)} cannot be read without a service-role key. "
                    "Those objects are recorded in the manifest but their bytes are NOT in this backup.")

          manifest, fetched, total = [], 0, 0
          for item in items:
              entry = {k: item[k] for k in ("bucket", "name", "size", "mime", "public")}
              if not item["public"]:
                  entry["status"] = "not-backed-up: private bucket"
                  manifest.append(entry)
                  continue
              quoted = urllib.parse.quote(item["name"], safe="/")
              url = f"https://{ref}.supabase.co/storage/v1/object/public/{item['bucket']}/{quoted}"
              try:
                  with urllib.request.urlopen(url, timeout=120) as resp:
                      blob = resp.read()
              except Exception as exc:                      # noqa: BLE001
                  print(f"::error title=Storage object unreadable::{item['bucket']}/{item['name']}: {exc}")
                  sys.exit(1)

              # The DB says how big it should be. Trust that over the transfer.
              if item["size"] is not None and len(blob) != int(item["size"]):
                  print(f"::error title=Storage object truncated::{item['bucket']}/{item['name']} "
                        f"is {len(blob)} bytes, expected {item['size']}.")
                  sys.exit(1)

              dest = root / item["bucket"] / item["name"]
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(blob)
              entry["sha256"] = hashlib.sha256(blob).hexdigest()
              entry["status"] = "ok"
              manifest.append(entry)
              fetched += 1
              total += len(blob)

          json.dump(manifest, open("backup/storage-manifest.json", "w"), indent=2)
          os.remove("backup/storage-inventory.json")
          root.mkdir(parents=True, exist_ok=True)   # exists even when empty
          print(f"storage: {fetched}/{len(items)} objects, {total} bytes")
          FETCH

      # A backup nobody checked is a hypothesis. This does not prove the dump
      # RESTORES — only a real restore does that, and the runbook covers it —
      # but it does prove the file is not empty, truncated, or schema-only.
      - name: Sanity-check the dump before trusting it
        run: |
          set -euo pipefail
          fail() { echo "::error title=Backup failed its own check::$1"; exit 1; }

          for f in schema data; do
            [ -s "backup/$f.sql" ] || fail "backup/$f.sql is empty."
          done

          # Tables that must exist in any real dump of this app. If the schema
          # dump lost them, the restore would come up missing the CRM.
          for t in organizations contacts leads campaigns pipeline_stages; do
            grep -q "CREATE TABLE.*\.$t " backup/schema.sql \
              || fail "schema.sql has no CREATE TABLE for '$t' — the dump is not this application's schema."
          done

          # Data, not just structure. COPY blocks are how pg_dump emits rows.
          grep -q "^COPY " backup/data.sql \
            || fail "data.sql contains no COPY blocks — this is a schema-only dump wearing a data filename."

          # The four checks below exist because the 2026-07-31 restore test
          # (BSR-532) found a backup that passed every check above and still
          # restored to 19 of 157 policies, 0 campaigns and no accounts. Each
          # one pins a specific way that dump was silently incomplete.

          # Every policy that calls app_private must find it in the same file.
          POLICIES=$(grep -c "^CREATE POLICY" backup/schema.sql || true)
          NEED_PRIVATE=$(grep "^CREATE POLICY" backup/schema.sql | grep -c "app_private\." || true)
          if [ "$NEED_PRIVATE" -gt 0 ]; then
            grep -q "CREATE SCHEMA app_private" backup/schema.sql \
              || fail "${NEED_PRIVATE} of ${POLICIES} policies call app_private, but the schema is not in this dump. Restoring it would leave the database deny-all."
            grep -q "FUNCTION app_private.is_org_member" backup/schema.sql \
              || fail "app_private.is_org_member is missing — tenant isolation would not restore."
          fi

          # An extension a --schema=public dump omits takes its dependants down.
          if grep -q "public\.vector" backup/schema.sql; then
            grep -q "CREATE EXTENSION IF NOT EXISTS vector" backup/00-prereq.sql \
              || fail "the schema uses public.vector but 00-prereq.sql does not create it — knowledge_nodes and Arc's memory would not restore."
          fi

          # Accounts that can actually sign in.
          grep -q "^COPY auth.identities" backup/auth-users.sql \
            || echo "::warning title=No identities::auth.identities is absent; restored accounts will exist but be unable to log in."

          # Storage bytes match the rows that describe them. The dump carries
          # storage.objects metadata, so a mismatch means a restore would hand
          # back rows pointing at files this backup does not contain.
          python3 - <<'CHECK'
          import json, pathlib, sys
          manifest = json.load(open("backup/storage-manifest.json"))
          missing = []
          for entry in manifest:
              if entry.get("status") != "ok":
                  continue
              path = pathlib.Path("backup/storage") / entry["bucket"] / entry["name"]
              if not path.exists() or path.stat().st_size != int(entry["size"]):
                  missing.append(f"{entry['bucket']}/{entry['name']}")
          if missing:
              print("::error title=Storage manifest disagrees with the files::"
                    + ", ".join(missing[:5]))
              sys.exit(1)
          ok = sum(1 for e in manifest if e.get("status") == "ok")
          print(f"storage {ok}/{len(manifest)} objects verified against the manifest")
          CHECK

          DATA_BYTES=$(stat -c%s backup/data.sql)
          # The database was 29 MB in July 2026; a data dump far under a
          # megabyte means something went wrong, not that the CRM shrank.
          [ "$DATA_BYTES" -gt 200000 ] \
            || fail "data.sql is only ${DATA_BYTES} bytes. Expected megabytes. Treat this run as failed rather than as a small backup."

          echo "schema $(stat -c%s backup/schema.sql)B (${POLICIES} policies) · data ${DATA_BYTES}B · accounts $(stat -c%s backup/auth-users.sql)B"

      - name: Encrypt
        env:
          RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STAMP=$STAMP" >>"$GITHUB_ENV"
          # restore.sh travels with the bytes it knows how to restore — a
          # recovery procedure kept only in a doc is one you have to go find
          # during the incident.
          tar -czf "arc-prod-$STAMP.tar.gz" -C backup \
            00-prereq.sql schema.sql auth-users.sql data.sql restore.sh \
            storage-manifest.json storage
          age -r "$RECIPIENT" -o "arc-prod-$STAMP.tar.gz.age" "arc-prod-$STAMP.tar.gz"

          # Remove every plaintext copy before anything can upload it. The
          # encrypted file is the only thing that may leave this runner.
          rm -rf backup "arc-prod-$STAMP.tar.gz"
          ls -l "arc-prod-$STAMP.tar.gz.age"

          # Cheap proof it is really encrypted: age files begin with this header.
          head -c 22 "arc-prod-$STAMP.tar.gz.age" | grep -q "age-encryption.org" \
            || { echo "::error title=Not encrypted::The artifact does not look like an age file. Refusing to upload it."; exit 1; }

      # PRIMARY destination. Private bucket, 365-day lifecycle, in the same GCP
      # project as the runner.
      #
      # The service account holds `roles/storage.objectCreator` and nothing else:
      # this job can WRITE a new backup but cannot read one back or delete one.
      # So a compromised workflow can neither exfiltrate history nor destroy it —
      # and combined with the age encryption above, it cannot read even the file
      # it just wrote.
      - name: Authenticate to Google Cloud
        id: gcp_auth
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BACKUP_SERVICE_ACCOUNT }}
          token_format: access_token

      # Uploaded through the JSON API rather than `gcloud storage cp`.
      #
      # `cp` does a preflight `storage.objects.get` to decide whether it is
      # overwriting, and this service account deliberately cannot read:
      #   403 ... does not have storage.objects.get access
      # The fix is NOT to grant objectViewer. That would let a compromised
      # workflow download every historical backup, which is exactly the reach
      # this design removes. A plain upload needs only `storage.objects.create`,
      # so the API call keeps create-only intact.
      - name: Upload to the bucket
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        env:
          TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          BUCKET: ${{ vars.GCP_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          OBJ="arc-prod-$STAMP.tar.gz.age"
          CODE=$(curl -sS -o /tmp/gcs.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$OBJ" \
            "https://storage.googleapis.com/upload/storage/v1/b/$BUCKET/o?uploadType=media&name=$OBJ")
          if [ "$CODE" != "200" ]; then
            echo "::error title=Backup not stored::GCS upload returned HTTP $CODE. The encrypted dump exists on this runner and as an artifact, but it did NOT reach the bucket."
            cat /tmp/gcs.json || true
            exit 1
          fi
          # The API echoes the stored object's size; compare it to what we sent.
          # Create-only means we cannot read the object back, so this response is
          # the only confirmation available that the bytes landed intact.
          SENT=$(stat -c%s "$OBJ")
          STORED=$(python3 -c "import json;print(json.load(open('/tmp/gcs.json')).get('size','?'))")
          echo "sent ${SENT}B · stored ${STORED}B"
          [ "$SENT" = "$STORED" ] || { echo "::error title=Size mismatch::Sent ${SENT}B but the bucket recorded ${STORED}B."; exit 1; }
          echo "Stored gs://$BUCKET/$OBJ"

      # SECOND copy, deliberately kept. Two independent destinations is the point
      # of a backup; if the GCP project is the thing that breaks, an artifact in
      # GitHub is still there. It is encrypted, so a public repo is not a leak.
      - name: Upload artifact (second copy)
        uses: actions/upload-artifact@v4
        with:
          name: arc-prod-backup-${{ env.STAMP }}
          retention-days: 90
          if-no-files-found: error
          path: "*.tar.gz.age"

      - name: Summary
        run: |
          {
            echo "### Prod backup — \`$STAMP\`"
            echo ""
            echo "Encrypted to \`${{ vars.BACKUP_AGE_RECIPIENT }}\`."
            echo ""
            echo "- \`gs://${{ vars.GCP_BACKUP_BUCKET }}\` — primary, 365-day lifecycle"
            echo "- GitHub artifact — second copy, 90 days"
            echo ""
            echo "This is a compensating control while the Supabase org is on the free plan (BSR-532)."
            echo "RPO ~24h. No point-in-time recovery. Restore steps: \`docs/runbooks/backup-and-restore.md\`."
          } >>"$GITHUB_STEP_SUMMARY"
